[package]
name = "deck-craft-audio"
version = "0.3.0"
edition = "2024"
license = "MIT"
rust-version = "1.87"

[dependencies]
rodio = { version = "=0.23.0", default-features = false, features = ["playback", "wav", "mp3", "flac", "vorbis", "mp4", "symphonia-aiff", "symphonia-alac"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
rtrb = "=0.4.0"
# Embedded-artwork extraction reads tags through the same Symphonia version Rodio already uses.
symphonia = { version = "=0.5.5", default-features = false, features = ["wav", "mp3", "flac", "ogg", "vorbis", "isomp4", "aac", "aiff", "alac", "pcm"] }
# Untrusted cover images are decoded and reduced to a small thumbnail inside this isolated one-shot child.
png = "=0.18.1"
zune-jpeg = { version = "=0.5.15", default-features = false, features = ["std"] }

[dev-dependencies]
hound = "3.5"
