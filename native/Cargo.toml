[package]
name = "deck-craft-audio"
version = "0.3.0"
edition = "2024"
license = "MIT"
rust-version = "1.87"

[dependencies]
rodio = { version = "=0.23.0", default-features = false, features = ["playback", "wav", "mp3", "flac", "vorbis", "mp4", "symphonia-aiff", "symphonia-alac"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
rtrb = "=0.4.0"

[dev-dependencies]
hound = "3.5"
